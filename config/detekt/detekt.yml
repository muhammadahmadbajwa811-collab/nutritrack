build:
  maxIssues: 0
  weights:
    complexity: 2
    formatting: 1
    LongParameterList: 1
    style: 1

complexity:
  active: true
  LongMethod:
    threshold: 60
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
  CyclomaticComplexMethod:
    threshold: 15

naming:
  active: true
  FunctionNaming:
    functionPattern: '^[a-zA-Z][a-zA-Z0-9]*$'
    excludeClassPattern: '$^'
    ignoreOverridden: true
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'
    propertyPattern: '[A-Za-z][_A-Za-z0-9]*'

style:
  active: true
  MagicNumber:
    active: false
  WildcardImport:
    active: false
  UnusedPrivateMember:
    active: true
